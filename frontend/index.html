<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#07070b" />
  <!-- The admin's saved colour theme (src/lib/theme.js), applied before the first paint. The public site is always dark. -->
  <script>
    try {
      if (/^\/admin(\/|$)/.test(location.pathname) && localStorage.getItem('allsemi-theme') === 'light') {
        document.documentElement.dataset.theme = 'light';
        document.querySelector('meta[name="theme-color"]').setAttribute('content', '#f6f5fa');
      }
    } catch (e) {}
  </script>
  <!-- The page's title, description, canonical address, sharing tags and
       structured data. Filled in by the "allsemis-seo" plugin
       (vite.config.js) for each page; lib/seo.js keeps them current in
       the browser. -->
  <!--seo-->

  <link rel="icon" href="/favicon.ico" sizes="any">
  <link rel="icon" type="image/png" sizes="32x32" href="/icons/favicon-32.png">
  <link rel="icon" type="image/png" sizes="192x192" href="/icons/favicon-192.png">
  <link rel="apple-touch-icon" sizes="180x180" href="/icons/favicon-180.png">
  <link rel="manifest" href="/site.webmanifest">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <!-- The web fonts load without holding up the first paint: text is drawn
       at once in a local fallback sized to the same metrics
       (styles/tailwind.css, FONT FALLBACKS), so the swap moves nothing. -->
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Sora:wght@800&family=Space+Grotesk:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&family=JetBrains+Mono:wght@500;600&display=swap" media="print" onload="this.media='all'">
  <noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Sora:wght@800&family=Space+Grotesk:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&family=JetBrains+Mono:wght@500;600&display=swap"></noscript>
</head>
<body>
  <div id="root"></div>
  <script type="module" src="/src/main.jsx"></script>
</body>
</html>
